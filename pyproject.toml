[project]
name = "gtt-smartbot-backend"
version = "0.1.0"
description = "GTT SmartBot Backend with Enterprise Session Authority"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy>=2.0.0",
    "pyodbc>=4.0.39",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.13",
    "email-validator>=2.0.0",
    "httpx>=0.28.0",
    "pytz>=2024.1",
    "alembic>=1.13.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pyright]
include = ["app", "alembic"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
